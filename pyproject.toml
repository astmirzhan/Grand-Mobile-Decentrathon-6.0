[project]
name = "locqa"
version = "0.1.0"
description = "QA for ARB localization files (Kazakh first)"
requires-python = ">=3.10"
dependencies = ["openai>=1.60"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["locqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
